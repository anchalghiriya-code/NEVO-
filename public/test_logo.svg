<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 330" width="480" height="660">
  <defs>
    <style>
      .bg { fill: #FAF7F2; rx: 16px; ry: 16px; }
      .burgundy { fill: #821B3D; stroke: #821B3D; }
      .burgundy-fill { fill: #821B3D; }
      .burgundy-stroke { stroke: #821B3D; fill: none; }
      .rose-line { stroke: #D9AAB7; stroke-width: 1.2; stroke-linecap: round; }
      .leaf { fill: #488153; }
      .serif-text { font-family: "Playfair Display", "Didot", "Bodoni MT", "Georgia", serif; font-weight: 700; fill: #821B3D; }
      .sans-text { font-family: "Plus Jakarta Sans", "Inter", "Space Grotesk", sans-serif; font-size: 8.5px; font-weight: 700; letter-spacing: 0.22em; fill: #54444C; }
    </style>
  </defs>
  
  <!-- Subtle Cream Card Container matching exact image -->
  <rect width="240" height="330" rx="16" fill="#FAF7F2" />
  
  <!-- ================= LADY SILHOUETTE & CORSET ================= -->
  <!-- Vintage Hair Silhouette -->
  <path d="M117 33 C113 33 107 36 104 42 C101 48 102 55 106 59 C108 61 106 66 103 69 C105 69 108 68 110 65 C113 60 115 54 116 48 C117 44 119 41 123 41 C127 41 127 45 125 48 C123 51 123 54 125 56 C127 54 129 50 128 45 C127 38 122 33 117 33 Z" fill="#821B3D" />
  
  <!-- Neck and Delicate Shoulders -->
  <path d="M114 56 C111 63 107 72 101 81" stroke="#821B3D" stroke-width="1.3" fill="none" stroke-linecap="round" />
  <path d="M125 56 C128 63 132 72 138 81" stroke="#821B3D" stroke-width="1.3" fill="none" stroke-linecap="round" />
  
  <!-- Outer Arms framing the torso -->
